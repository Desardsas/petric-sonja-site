    <section class="section conteneur contact">
      <div class="coordonnees">
        <p class="surtitre">Contact</p>
        <h1>Écrivez-moi</h1>
        <p>Pour une commande, une acquisition, une exposition ou simplement un échange.</p>
        <p>E-mail : <a href="mailto:contact@exemple.fr">contact@exemple.fr</a><br>
           Instagram : <a href="https://www.instagram.com/" rel="noopener">@[compte]</a><br>
           Atelier : [Ville]</p>
      </div>
      <!-- Formulaire envoyé par Formspree (gratuit) : remplacer VOTRE_ID par l'identifiant du formulaire -->
      <form class="formulaire" action="https://formspree.io/f/VOTRE_ID" method="POST">
        <label>Nom<input name="nom" required autocomplete="name"></label>
        <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
        <label>Message<textarea name="message" required></textarea></label>
        <div><button class="bouton plein" type="submit">Envoyer</button></div>
      </form>
    </section>
